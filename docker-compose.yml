services:
  mailflare:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=https://workspace.growthkulagency.com
      - CF_TOKEN=${CF_TOKEN}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - SMTP_URL=${SMTP_URL}
    volumes:
      - ../files/mailflare-data:/data
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
